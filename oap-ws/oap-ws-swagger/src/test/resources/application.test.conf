boot.main:
  - oap-ws-swagger-test

services:
  oap-http:
    oap-http-server.parameters:
      defaultPort.httpPort: ${TEST_HTTP_PORT}
      additionalHttpPorts.httpprivate: ${TEST_HTTP_PORT}

  oap-ws.session-manager.parameters.cookieDomain: "localhost"

  oap-ws-swagger.swagger-ui:
    parameters:
      version: "5.33.2"
      urls:
        - name: "api"
          url: "/system/openapi"
